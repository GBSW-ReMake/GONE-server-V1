name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  checkstyle:
    runs-on: ubuntu-22.04

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: 시작 시각 기록
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Google Code Style 검사
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Checkstyle 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

      - name: 알림용 컨텍스트 수집
        if: failure()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # PR에서 온 이벤트인지 push인지에 따라 다른 컨텍스트(github.event.*)에서 값을 가져온다.
          # PR 제목/커밋 메시지는 사용자가 자유롭게 입력하는 값이라, run 스크립트 본문에 직접
          # 표현식으로 끼워넣지 않고 env로 받아 셸 변수로만 다룬다(스크립트 인젝션 방지).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SHA="$PR_SHA"
            MSG="$PR_TITLE"
            PR_FIELD="[#$PR_NUMBER $PR_TITLE]($PR_URL)"
          else
            SHA="$PUSH_SHA"
            MSG="$(printf '%s' "$PUSH_COMMIT_MESSAGE" | head -1)"
            PR_FIELD="push to \`$REF_NAME\`"
          fi

          # Checkstyle 리포트(main.xml/test.xml)의 <error 태그 개수 = 위반 건수.
          VIOLATIONS=0
          if compgen -G "build/reports/checkstyle/*.xml" > /dev/null; then
            VIOLATIONS=$(grep -oh '<error ' build/reports/checkstyle/*.xml 2>/dev/null | wc -l)
          fi

          {
            echo "PR_FIELD=$PR_FIELD"
            echo "SHORT_SHA=${SHA:0:7}"
            echo "COMMIT_MSG=$MSG"
            echo "VIOLATIONS=$VIOLATIONS"
            echo "ELAPSED=$(( $(date +%s) - JOB_START ))s"
          } >> "$GITHUB_ENV"

      - name: Discord 알림 (Checkstyle 실패)
        if: failure()
        env:
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "❌ Checkstyle 실패" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg pr "$PR_FIELD" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg violations "${VIOLATIONS}건" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 16711680,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "브랜치/PR", value: $pr, inline: true},
                {name: "커밋", value: $commit, inline: true},
                {name: "위반 건수", value: $violations, inline: true},
                {name: "소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_CI_WEBHOOK"

  build-and-test:
    runs-on: ubuntu-22.04
    needs: checkstyle

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gone
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # R2Properties(@NotBlank) 검증을 통과시키기 위한 더미 값.
      # contextLoads()는 실제 R2 API를 호출하지 않으므로 진짜 자격 증명이 필요 없다.
      R2_ACCOUNT_ID: dummy-account-id
      R2_ACCESS_KEY: dummy-access-key
      R2_SECRET_KEY: dummy-secret-key
      R2_BUCKET: dummy-bucket
      R2_ENDPOINT: https://dummy.r2.cloudflarestorage.com
      # JwtProperties(@NotBlank/@NotNull) 검증을 통과시키기 위한 더미 값. 실제 서명 검증은
      # JwtProviderTest 등에서 자체 값으로 하므로, 여기서는 컨텍스트 로딩만 통과하면 된다.
      JWT_SECRET: dummy-jwt-secret-for-ci-context-loading-only
      JWT_ACCESS_TOKEN_EXPIRATION: 1800000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: 시작 시각 기록
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 빌드 + 테스트
        run: ./gradlew build -x checkstyleMain -x checkstyleTest

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

      - name: 테스트 결과 요약 집계
        if: always()
        run: |
          # JUnit XML(testsuite 태그의 tests/failures/errors/skipped 속성)을 합산한다.
          TOTAL=0; FAILED=0; ERRORS=0; SKIPPED=0
          if compgen -G "build/test-results/test/*.xml" > /dev/null; then
            TOTAL=$(grep -oh 'tests="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            FAILED=$(grep -oh 'failures="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            ERRORS=$(grep -oh 'errors="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            SKIPPED=$(grep -oh 'skipped="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          fi
          PASSED=$(( TOTAL - FAILED - ERRORS - SKIPPED ))
          echo "TEST_SUMMARY=${PASSED} passed, $((FAILED + ERRORS)) failed, ${SKIPPED} skipped" >> "$GITHUB_ENV"

      - name: 알림용 컨텍스트 수집
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # PR 제목/커밋 메시지는 사용자가 자유롭게 입력하는 값이라, run 스크립트 본문에 직접
          # 표현식으로 끼워넣지 않고 env로 받아 셸 변수로만 다룬다(스크립트 인젝션 방지).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SHA="$PR_SHA"
            MSG="$PR_TITLE"
            PR_FIELD="[#$PR_NUMBER $PR_TITLE]($PR_URL)"
          else
            SHA="$PUSH_SHA"
            MSG="$(printf '%s' "$PUSH_COMMIT_MESSAGE" | head -1)"
            PR_FIELD="push to \`$REF_NAME\`"
          fi

          {
            echo "PR_FIELD=$PR_FIELD"
            echo "SHORT_SHA=${SHA:0:7}"
            echo "COMMIT_MSG=$MSG"
            echo "ELAPSED=$(( $(date +%s) - JOB_START ))s"
          } >> "$GITHUB_ENV"

      - name: Discord 알림 (성공)
        if: success()
        env:
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "✅ CI 성공" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg pr "$PR_FIELD" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg tests "$TEST_SUMMARY" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 65280,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "브랜치/PR", value: $pr, inline: true},
                {name: "커밋", value: $commit, inline: true},
                {name: "테스트", value: $tests, inline: true},
                {name: "소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_CI_WEBHOOK"

      - name: Discord 알림 (실패)
        if: failure()
        env:
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "❌ CI 실패" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg pr "$PR_FIELD" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg tests "$TEST_SUMMARY" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 16711680,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "브랜치/PR", value: $pr, inline: true},
                {name: "커밋", value: $commit, inline: true},
                {name: "테스트", value: $tests, inline: true},
                {name: "소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_CI_WEBHOOK"
