name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
  push:
    branches:
      - main
      - dev
      - staging

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-22.04

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: 시작 시각 기록
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Google Code Style 검사
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Checkstyle 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

      - name: 알림용 컨텍스트 수집
        if: failure()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # PR에서 온 이벤트인지 push인지에 따라 다른 컨텍스트(github.event.*)에서 값을 가져온다.
          # PR 제목/커밋 메시지는 사용자가 자유롭게 입력하는 값이라, run 스크립트 본문에 직접
          # 표현식으로 끼워넣지 않고 env로 받아 셸 변수로만 다룬다(스크립트 인젝션 방지).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SHA="$PR_SHA"
            MSG="$PR_TITLE"
            PR_FIELD="[#$PR_NUMBER $PR_TITLE]($PR_URL)"
          else
            SHA="$PUSH_SHA"
            MSG="$(printf '%s' "$PUSH_COMMIT_MESSAGE" | head -1)"
            PR_FIELD="push to \`$REF_NAME\`"
          fi

          # Checkstyle 리포트(main.xml/test.xml)의 <error 태그 개수 = 위반 건수.
          VIOLATIONS=0
          if compgen -G "build/reports/checkstyle/*.xml" > /dev/null; then
            VIOLATIONS=$(grep -oh '<error ' build/reports/checkstyle/*.xml 2>/dev/null | wc -l)
          fi

          {
            echo "PR_FIELD=$PR_FIELD"
            echo "SHORT_SHA=${SHA:0:7}"
            echo "COMMIT_MSG=$MSG"
            echo "VIOLATIONS=$VIOLATIONS"
            echo "ELAPSED=$(( $(date +%s) - JOB_START ))s"
          } >> "$GITHUB_ENV"

      - name: Discord 알림 (Checkstyle 실패)
        if: failure()
        # 시크릿 미설정(예: fork PR) 등으로 알림 발송 자체가 실패해도, 이미 확정된
        # checkstyle 실패 결과와 무관한 별개 문제이므로 job 전체를 추가로 실패시키지 않는다.
        continue-on-error: true
        env:
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "❌ Checkstyle 실패" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg pr "$PR_FIELD" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg violations "${VIOLATIONS}건" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 16711680,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "브랜치/PR", value: $pr, inline: true},
                {name: "커밋", value: $commit, inline: true},
                {name: "위반 건수", value: $violations, inline: true},
                {name: "소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_CI_WEBHOOK"

  build-and-test:
    runs-on: ubuntu-22.04
    needs: checkstyle

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gone
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # R2Properties(@NotBlank) 검증을 통과시키기 위한 더미 값.
      # contextLoads()는 실제 R2 API를 호출하지 않으므로 진짜 자격 증명이 필요 없다.
      R2_ACCOUNT_ID: dummy-account-id
      R2_ACCESS_KEY: dummy-access-key
      R2_SECRET_KEY: dummy-secret-key
      R2_BUCKET: dummy-bucket
      R2_ENDPOINT: https://dummy.r2.cloudflarestorage.com
      # JwtProperties(@NotBlank/@NotNull) 검증을 통과시키기 위한 더미 값. 실제 서명 검증은
      # JwtProviderTest 등에서 자체 값으로 하므로, 여기서는 컨텍스트 로딩만 통과하면 된다.
      # Access/Refresh Token은 서로 다른 키로 서명하므로(#52) 더미 값도 둘로 나눈다.
      JWT_ACCESS_TOKEN_SECRET: dummy-jwt-access-secret-for-ci-context-loading-only
      JWT_REFRESH_TOKEN_SECRET: dummy-jwt-refresh-secret-for-ci-context-loading-only
      JWT_ACCESS_TOKEN_EXPIRATION: 1800000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000
      # NeisProperties(@NotBlank) 검증을 통과시키기 위한 더미 값. contextLoads()는 실제 NEIS
      # API를 호출하지 않으므로 진짜 인증키가 필요 없다.
      NEIS_API_KEY: dummy-neis-api-key
      NEIS_ATPT_OFCDC_SC_CODE: dummy-code
      NEIS_SD_SCHUL_CODE: dummy-school-code
      # AligoProperties(@NotBlank) 검증을 통과시키기 위한 더미 값. contextLoads()는 실제
      # 알리고 API를 호출하지 않으므로 진짜 키가 필요 없다.
      ALIGO_KEY: dummy-aligo-key
      ALIGO_USER_ID: dummy-aligo-user-id
      ALIGO_SENDER: '01000000000'
      # OutingProperties(@NotNull) 검증을 통과시키기 위한 더미 값. contextLoads()는 실제
      # 반경 판정을 검증하지 않으므로 실제 학교 좌표가 필요 없다(#43, staging 배포 전
      # OUTING_SCHOOL_* 실제 좌표를 GitHub Environment "STAGING" 시크릿으로 별도 등록).
      OUTING_SCHOOL_LATITUDE: '0.0'
      OUTING_SCHOOL_LONGITUDE: '0.0'
      OUTING_SCHOOL_RADIUS_METERS: '200'

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: 시작 시각 기록
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 빌드 + 테스트
        run: ./gradlew build -x checkstyleMain -x checkstyleTest

      - name: 빌드 아티팩트(jar) 업로드
        # staging EC2(구 dev EC2) 배포(#51, #77)를 위해, 이미 테스트까지 통과한 jar를
        # 이후 job에서 재사용한다.
        # Docker 이미지 안에서 다시 컴파일하지 않기 위함.
        # retention-days를 지정하지 않으면 GitHub 기본값(90일)이 적용돼 매 실행마다 쌓인
        # jar가 레포 아티팩트 저장 용량을 다 채워버린다(#89 QA 중 발견 — 이후 CI 아티팩트
        # 업로드 스텝 전체가 실패했었다). 이 jar는 같은 워크플로우 실행 안에서
        # build-and-push-image 잡에만 넘겨주면 끝이라 그 이후에는 필요 없다.
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          retention-days: 1
          path: build/libs/*.jar

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

      - name: 테스트 결과 요약 집계
        if: always()
        run: |
          # JUnit XML의 <testsuite ...> 여는 태그 한 줄(파일당 정확히 1개)만 뽑아서 그 안의
          # tests/failures/errors/skipped 속성을 합산한다. 파일 전체를 grep하면 <system-out>에
          # 캡처된 테스트 콘솔 로그(예: Hibernate/Spring 로그) 안에 우연히 같은 패턴의 문자열이
          # 찍혀 있을 때 중복 집계될 수 있어, 반드시 <testsuite 줄로 먼저 좁힌다.
          TOTAL=0; FAILED=0; ERRORS=0; SKIPPED=0
          if compgen -G "build/test-results/test/*.xml" > /dev/null; then
            SUITE_LINES=$(grep -h '<testsuite ' build/test-results/test/*.xml)
            TOTAL=$(echo "$SUITE_LINES" | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            FAILED=$(echo "$SUITE_LINES" | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            ERRORS=$(echo "$SUITE_LINES" | grep -o 'errors="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            SKIPPED=$(echo "$SUITE_LINES" | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          fi
          PASSED=$(( TOTAL - FAILED - ERRORS - SKIPPED ))
          echo "TEST_SUMMARY=${PASSED} passed, $((FAILED + ERRORS)) failed, ${SKIPPED} skipped" >> "$GITHUB_ENV"

      - name: 알림용 컨텍스트 수집
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # PR 제목/커밋 메시지는 사용자가 자유롭게 입력하는 값이라, run 스크립트 본문에 직접
          # 표현식으로 끼워넣지 않고 env로 받아 셸 변수로만 다룬다(스크립트 인젝션 방지).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SHA="$PR_SHA"
            MSG="$PR_TITLE"
            PR_FIELD="[#$PR_NUMBER $PR_TITLE]($PR_URL)"
          else
            SHA="$PUSH_SHA"
            MSG="$(printf '%s' "$PUSH_COMMIT_MESSAGE" | head -1)"
            PR_FIELD="push to \`$REF_NAME\`"
          fi

          {
            echo "PR_FIELD=$PR_FIELD"
            echo "SHORT_SHA=${SHA:0:7}"
            echo "COMMIT_MSG=$MSG"
            echo "ELAPSED=$(( $(date +%s) - JOB_START ))s"
          } >> "$GITHUB_ENV"

      - name: Discord 알림 (성공)
        if: success()
        # 알림 발송 실패(시크릿 미설정 등)가 이미 통과한 빌드/테스트 결과를 뒤집어 job을
        # 실패로 만들지 않도록 한다.
        continue-on-error: true
        env:
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "✅ CI 성공" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg pr "$PR_FIELD" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg tests "$TEST_SUMMARY" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 65280,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "브랜치/PR", value: $pr, inline: true},
                {name: "커밋", value: $commit, inline: true},
                {name: "테스트", value: $tests, inline: true},
                {name: "소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_CI_WEBHOOK"

      - name: Discord 알림 (실패)
        if: failure()
        # 알림 발송 자체의 실패(시크릿 미설정 등)를 이미 확정된 빌드/테스트 실패와 별개로
        # 다룬다 — 알림 실패로 인해 원인이 더 헷갈리는 추가 실패 스텝이 쌓이지 않게 한다.
        continue-on-error: true
        env:
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "❌ CI 실패" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg pr "$PR_FIELD" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg tests "$TEST_SUMMARY" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 16711680,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "브랜치/PR", value: $pr, inline: true},
                {name: "커밋", value: $commit, inline: true},
                {name: "테스트", value: $tests, inline: true},
                {name: "소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_CI_WEBHOOK"

  build-and-push-image:
    # #77: staging 브랜치 push일 때만 실행 — PR에서는 절대 이미지가 푸시되지 않는다.
    # if를 직접 지정하면 needs job의 success() 자동 검사가 사라지므로 명시적으로 포함한다
    # (없으면 build-and-test 실패 시 "스킵"이 아니라 아티팩트 없음으로 인한 실패로 표시됨).
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/staging'

    permissions:
      contents: read
      packages: write

    # 연속 push 시 오래된 커밋의 빌드가 나중에 끝나 :dev 태그를 덮어쓰는 걸 막는다
    # (deploy-staging의 concurrency와 달리, 이미지 빌드는 취소돼도 안전하므로 최신 push만
    # 남기고 이전 실행을 취소한다).
    concurrency:
      group: build-and-push-image
      cancel-in-progress: true

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: 빌드 아티팩트(jar) 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 + 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gbsw-remake/gone-server-v1:dev

  deploy-staging:
    # #77: staging EC2(구 dev EC2)에 app 컨테이너만 갱신한다. mysql/redis는 이 job이
    # 건드리지 않는다. environment: STAGING으로 선언해 이 job은 GitHub Environment
    # "STAGING"에 등록된 시크릿만 참조한다 — 나중에 운영 배포 job이 생기면
    # environment: PRODUCTION을 선언하고 같은 이름(EC2_HOST 등)으로 다른 값을 등록하면
    # 된다(접두사로 구분할 필요 없음).
    runs-on: ubuntu-22.04
    needs: build-and-push-image
    environment: STAGING

    permissions:
      contents: read

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
      JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      NEIS_ATPT_OFCDC_SC_CODE: ${{ secrets.NEIS_ATPT_OFCDC_SC_CODE }}
      NEIS_SD_SCHUL_CODE: ${{ secrets.NEIS_SD_SCHUL_CODE }}
      ALIGO_KEY: ${{ secrets.ALIGO_KEY }}
      ALIGO_USER_ID: ${{ secrets.ALIGO_USER_ID }}
      ALIGO_SENDER: ${{ secrets.ALIGO_SENDER }}

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: 시작 시각 기록
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 배포 단계 기록 (파일 전송)
        run: echo "CURRENT_STAGE=파일 전송(scp)" >> "$GITHUB_ENV"

      - name: docker-compose 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.dev.yml,deploy/nginx.conf"
          target: "/opt/gone/dev"
          strip_components: 1

      - name: 배포 단계 기록 (.env 생성 및 컨테이너 갱신)
        run: echo "CURRENT_STAGE=.env 생성 및 컨테이너 갱신(ssh)" >> "$GITHUB_ENV"

      - name: .env 생성 + 컨테이너 갱신
        # 애플리케이션 시크릿은 이 SSH 세션 안에서만 존재한다(GitHub Actions 로그에 남지
        # 않음). set -x 등 디버그 출력을 쓰지 않는다.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD,JWT_ACCESS_TOKEN_SECRET,JWT_REFRESH_TOKEN_SECRET,R2_ACCOUNT_ID,R2_ACCESS_KEY,R2_SECRET_KEY,R2_BUCKET,R2_ENDPOINT,NEIS_API_KEY,NEIS_ATPT_OFCDC_SC_CODE,NEIS_SD_SCHUL_CODE,ALIGO_KEY,ALIGO_USER_ID,ALIGO_SENDER
          script: |
            set -e
            cd /opt/gone/dev
            cat > .env <<ENVEOF
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            SPRING_PROFILES_ACTIVE=staging
            SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/gone?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
            SPRING_DATASOURCE_USERNAME=root
            SPRING_DATASOURCE_PASSWORD=$MYSQL_ROOT_PASSWORD
            SPRING_DATA_REDIS_HOST=redis
            SPRING_DATA_REDIS_PORT=6379
            JWT_ACCESS_TOKEN_SECRET=$JWT_ACCESS_TOKEN_SECRET
            JWT_REFRESH_TOKEN_SECRET=$JWT_REFRESH_TOKEN_SECRET
            JWT_ACCESS_TOKEN_EXPIRATION=1800000
            JWT_REFRESH_TOKEN_EXPIRATION=1209600000
            R2_ACCOUNT_ID=$R2_ACCOUNT_ID
            R2_ACCESS_KEY=$R2_ACCESS_KEY
            R2_SECRET_KEY=$R2_SECRET_KEY
            R2_BUCKET=$R2_BUCKET
            R2_ENDPOINT=$R2_ENDPOINT
            NEIS_API_KEY=$NEIS_API_KEY
            NEIS_ATPT_OFCDC_SC_CODE=$NEIS_ATPT_OFCDC_SC_CODE
            NEIS_SD_SCHUL_CODE=$NEIS_SD_SCHUL_CODE
            ALIGO_KEY=$ALIGO_KEY
            ALIGO_USER_ID=$ALIGO_USER_ID
            ALIGO_SENDER=$ALIGO_SENDER
            ENVEOF
            chmod 600 .env
            # 매 배포마다 :dev 태그가 새 이미지로 갱신되며 이전 레이어가 dangling으로
            # 남는다. 정리 없이 pull만 반복하면 디스크가 서서히 가득 차 pull 자체가
            # "no space left on device"로 실패한다 — pull 전에 미사용 이미지를 먼저 비운다.
            docker image prune -af
            docker compose -f docker-compose.dev.yml pull app
            docker compose -f docker-compose.dev.yml up -d app
            # nginx는 이미지 태그/볼륨 경로가 배포마다 안 바뀌어 위 up -d만으로는
            # 재기동되지 않는다. app이 새 컨테이너로 뜨며 내부 IP가 바뀔 수 있고
            # nginx.conf 파일 수정도 반영해야 하므로 매 배포마다 강제로 재생성한다.
            docker compose -f docker-compose.dev.yml up -d --force-recreate nginx

      - name: 배포 단계 기록 (헬스체크)
        run: echo "CURRENT_STAGE=헬스체크" >> "$GITHUB_ENV"

      - name: 헬스체크
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 이 프로젝트에 actuator가 없어 보장된 2xx 경로가 없다(루트 "/"는 정상 상태에서도
            # 404를 반환할 수 있음) — 그래서 --fail(2xx/3xx만 성공)은 오탐을 낸다. 대신
            # "5xx가 아니면(=서버가 요청을 정상적으로 처리하고 있으면) 정상"으로 판정한다.
            # nginx(80)를 거쳐 확인한다 — Cloudflare가 실제로 쓰는 경로와 동일하다(#62).
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo 000)
              if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
                echo "healthy (HTTP $code)"
                exit 0
              fi
              sleep 2
            done
            echo "health check failed after 60s"
            exit 1

      - name: 알림용 컨텍스트 수집
        if: always()
        env:
          PUSH_SHA: ${{ github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "SHORT_SHA=${PUSH_SHA:0:7}"
            echo "COMMIT_MSG=$(printf '%s' "$PUSH_COMMIT_MESSAGE" | head -1)"
            echo "ELAPSED=$(( $(date +%s) - JOB_START ))s"
          } >> "$GITHUB_ENV"

      - name: Discord 알림 (staging 배포 성공)
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "🚀 staging 배포 성공" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg branch "staging" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 65280,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "🌿 브랜치", value: $branch, inline: true},
                {name: "📦 커밋", value: $commit, inline: true},
                {name: "⏱️ 소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Discord 알림 (staging 배포 실패)
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "🔥 staging 배포 실패" \
            --arg actor "$GITHUB_ACTOR" \
            --arg avatar "https://github.com/$GITHUB_ACTOR.png" \
            --arg branch "staging" \
            --arg commit "\`$SHORT_SHA\` $COMMIT_MSG" \
            --arg stage "${CURRENT_STAGE:-알 수 없음}" \
            --arg elapsed "$ELAPSED" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title,
              color: 16711680,
              author: {name: $actor, icon_url: $avatar},
              fields: [
                {name: "🌿 브랜치", value: $branch, inline: true},
                {name: "📦 커밋", value: $commit, inline: true},
                {name: "⚠️ 실패 단계", value: $stage, inline: true},
                {name: "⏱️ 소요 시간", value: $elapsed, inline: true}
              ],
              url: $url
            }]}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
