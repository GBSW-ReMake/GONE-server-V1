name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  checkstyle:
    runs-on: ubuntu-22.04

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Google Code Style 검사
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Checkstyle 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

      - name: Discord 알림 (Checkstyle 실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "❌ Checkstyle 실패",
                   "description": "브랜치: `${{ github.ref_name }}`\n실행자: ${{ github.actor }}",
                   "color": 16711680,
                   "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                 }]
               }' \
               ${{ secrets.DISCORD_CI_WEBHOOK }}

  build-and-test:
    runs-on: ubuntu-22.04
    needs: checkstyle

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gone
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # R2Properties(@NotBlank) 검증을 통과시키기 위한 더미 값.
      # contextLoads()는 실제 R2 API를 호출하지 않으므로 진짜 자격 증명이 필요 없다.
      R2_ACCOUNT_ID: dummy-account-id
      R2_ACCESS_KEY: dummy-access-key
      R2_SECRET_KEY: dummy-secret-key
      R2_BUCKET: dummy-bucket
      R2_ENDPOINT: https://dummy.r2.cloudflarestorage.com

    steps:
      - name: Code Checkout(코드 체크아웃)
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 빌드 + 테스트
        run: ./gradlew build -x checkstyleMain -x checkstyleTest

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

      - name: Discord 알림 (성공)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "✅ CI 성공",
                   "description": "브랜치: `${{ github.ref_name }}`\n실행자: ${{ github.actor }}",
                   "color": 65280,
                   "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                 }]
               }' \
               ${{ secrets.DISCORD_CI_WEBHOOK }}

      - name: Discord 알림 (실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "❌ CI 실패",
                   "description": "브랜치: `${{ github.ref_name }}`\n실행자: ${{ github.actor }}",
                   "color": 16711680,
                   "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                 }]
               }' \
               ${{ secrets.DISCORD_CI_WEBHOOK }}